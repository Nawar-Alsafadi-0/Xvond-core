services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xvond-core:latest
    container_name: xvond-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      REDIS_URL: redis://redis:6379/0
      BACKUP_STATUS_DIR: /backup-status
      BACKUP_STALE_AFTER_SECONDS: ${BACKUP_STALE_AFTER_SECONDS:-129600}
    volumes:
      - xvond_backup_status:/backup-status:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  whatsapp-worker:
    image: xvond-core:latest
    container_name: xvond-whatsapp-worker
    restart: unless-stopped
    healthcheck:
      disable: true
    entrypoint: []
    command: ["python", "-m", "scripts.whatsapp_worker"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  automation-scheduler:
    image: xvond-core:latest
    container_name: xvond-automation-scheduler
    restart: unless-stopped
    healthcheck:
      disable: true
    entrypoint: []
    command: ["python", "-m", "scripts.automation_scheduler"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      REDIS_URL: redis://redis:6379/0
      AUTOMATION_SCHEDULER_POLL_SECONDS: ${AUTOMATION_SCHEDULER_POLL_SECONDS:-30}
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: xvond-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xvond}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-xvond}
    volumes:
      - xvond_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-xvond} -d ${POSTGRES_DB:-xvond}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-backup:
    image: postgres:17
    container_name: xvond-postgres-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-xvond}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-xvond}
      BACKUP_DIR: /backups
      BACKUP_STATUS_DIR: /backup-status
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - xvond_backups:/backups
      - xvond_backup_status:/backup-status
      - ./scripts:/opt/xvond/scripts:ro
    entrypoint: ["/bin/sh", "/opt/xvond/scripts/backup_loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  offsite-backup:
    image: restic/restic:0.19.1
    container_name: xvond-offsite-backup
    hostname: xvond-offsite-backup
    restart: unless-stopped
    profiles: ["offsite-backup"]
    env_file:
      - .env
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      BACKUP_STATUS_DIR: /backup-status
      OFFSITE_BACKUP_INTERVAL_SECONDS: ${OFFSITE_BACKUP_INTERVAL_SECONDS:-86400}
      OFFSITE_KEEP_DAILY: ${OFFSITE_KEEP_DAILY:-14}
      OFFSITE_KEEP_WEEKLY: ${OFFSITE_KEEP_WEEKLY:-8}
      OFFSITE_KEEP_MONTHLY: ${OFFSITE_KEEP_MONTHLY:-12}
    volumes:
      - xvond_backups:/backups:ro
      - xvond_backup_status:/backup-status
      - ./scripts:/opt/xvond/scripts:ro
    entrypoint: ["/bin/sh", "/opt/xvond/scripts/offsite_backup_loop.sh"]
    depends_on:
      postgres-backup:
        condition: service_started

  offsite-restore-verify:
    image: restic/restic:0.19.1
    hostname: xvond-offsite-restore-verify
    profiles: ["offsite-verify"]
    env_file:
      - .env
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      RESTORE_DIR: /restore
    volumes:
      - xvond_restore_verify:/restore
      - ./scripts:/opt/xvond/scripts:ro
    entrypoint: ["/bin/sh", "/opt/xvond/scripts/offsite_restore_latest.sh"]

  redis:
    image: redis:7.4-alpine
    container_name: xvond-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - xvond_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  workflow-postgres:
    image: postgres:17
    container_name: xvond-workflow-postgres
    restart: unless-stopped
    profiles: ["workflow"]
    environment:
      POSTGRES_USER: ${WORKFLOW_DB_USER:-xvond_workflow}
      POSTGRES_PASSWORD: ${WORKFLOW_DB_PASSWORD:?WORKFLOW_DB_PASSWORD is required}
      POSTGRES_DB: ${WORKFLOW_DB_NAME:-xvond_workflow}
    volumes:
      - xvond_workflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${WORKFLOW_DB_USER:-xvond_workflow} -d ${WORKFLOW_DB_NAME:-xvond_workflow}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  workflow-engine:
    image: n8nio/n8n:${WORKFLOW_ENGINE_VERSION:?WORKFLOW_ENGINE_VERSION is required}
    container_name: xvond-workflow-engine
    restart: unless-stopped
    profiles: ["workflow"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: workflow-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${WORKFLOW_DB_NAME:-xvond_workflow}
      DB_POSTGRESDB_USER: ${WORKFLOW_DB_USER:-xvond_workflow}
      DB_POSTGRESDB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?WORKFLOW_DB_PASSWORD is required}
      N8N_ENCRYPTION_KEY: ${WORKFLOW_ENCRYPTION_KEY:?WORKFLOW_ENCRYPTION_KEY is required}
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET:?N8N_SHARED_SECRET is required}
      XVOND_INTERNAL_ACTION_URL: ${XVOND_INTERNAL_ACTION_URL:-http://app:8000/internal/workflow/xvond-internal}
      XVOND_INTERNAL_CHANNEL_URL: ${XVOND_INTERNAL_CHANNEL_URL:-http://app:8000/internal/channels/message}
      XVOND_INTERNAL_CHANNEL_CONFIRM_URL: ${XVOND_INTERNAL_CHANNEL_CONFIRM_URL:-http://app:8000/internal/channels/delivery-confirmed}
      XVOND_WORKFLOW_INTEGRATIONS_JSON: ${XVOND_WORKFLOW_INTEGRATIONS_JSON:-{}}
      XVOND_CHANNEL_ROUTES_JSON: ${XVOND_CHANNEL_ROUTES_JSON:-{}}
      XVOND_TELEGRAM_ROUTES_JSON: ${XVOND_TELEGRAM_ROUTES_JSON:-{}}
      XVOND_META_MESSAGING_ROUTES_JSON: ${XVOND_META_MESSAGING_ROUTES_JSON:-{}}
      XVOND_META_MESSAGING_VERIFY_TOKEN: ${XVOND_META_MESSAGING_VERIFY_TOKEN:-}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_HOST: ${WORKFLOW_HOST:-workflow.xvond.com}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: ${WORKFLOW_PUBLIC_URL:?WORKFLOW_PUBLIC_URL is required}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: ${WORKFLOW_TIMEZONE:-Asia/Muscat}
      TZ: ${WORKFLOW_TIMEZONE:-Asia/Muscat}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    ports:
      - "127.0.0.1:${WORKFLOW_PORT:-5678}:5678"
    volumes:
      - xvond_workflow_data:/home/node/.n8n
    depends_on:
      workflow-postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  xvond_postgres_data:
  xvond_redis_data:
  xvond_backups:
  xvond_backup_status:
  xvond_restore_verify:
  xvond_workflow_postgres_data:
  xvond_workflow_data:
