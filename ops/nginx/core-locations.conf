# Include INSIDE the HTTPS server{} whose server_name matches PUBLIC_BASE_URL.
# If PUBLIC_BASE_URL=https://api.xvond.com, this snippet belongs in the api.xvond.com vhost.\n# Keep the existing landing location unchanged. Do not add a trailing URI to these proxy_pass values.
# If a broader regex location appears first, place this include before it.
location ~ ^/(admin-ui|customer-ui|login|dashboard|build)/?$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

location ~ ^/static/(admin/|customer/|public/|privacy\.html$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/(admin|customer|auth|public|webhooks|channels|ai-agents|users|companies|modules|company-modules|usage|internal|health|v1/voice)(/|$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
